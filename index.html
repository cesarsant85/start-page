<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu inicio | v.1.4 2026 (alpha)</title>
<link rel="icon" href="icons/favicon.ico" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>

/* ===================== VARIÁVEIS ===================== */
:root {
  --font-main: 'Sora', sans-serif;
  --font-mono: 'DM Mono', monospace;

  --clock-size: 88px;
  --seconds-size: 26px;
  --greeting-size: 17px;
  --date-size: 13px;

  --glass-bg: rgba(255,255,255,0.07);
  --glass-bg-hover: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.12);
  --glass-border-hover: rgba(255,255,255,0.22);

  --text: rgba(255,255,255,0.95);
  --text-dim: rgba(255,255,255,0.55);

  --ease: cubic-bezier(.25,.8,.25,1);
  --spring: cubic-bezier(.34,1.56,.64,1);

  /* Modal links scroll: altura = 7 itens × (item ~57px + gap 8px) */
  --modal-links-max-height: 455px;
}

/* ===================== RESET ===================== */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: var(--font-main);
  color: var(--text);
  background: #0a0a0a;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: background-image 1.6s ease;
  position: relative;
}

/* Overlay */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.50) 100%);
  backdrop-filter: blur(2px);
  z-index: 0;
}

/* ===================== CONTAINER ===================== */
.container {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-bottom: 90px;
  padding-left: 16px;
  padding-right: 16px;
}

/* ===================== RELÓGIO ===================== */
.clock-wrapper {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1;
  margin-bottom: 6px;
}

.clock {
  font-family: var(--font-mono);
  font-size: var(--clock-size);
  font-weight: 300;
  letter-spacing: -3px;
}

.seconds {
  font-family: var(--font-mono);
  font-size: var(--seconds-size);
  opacity: .5;
  margin-top: 18px;
}

.date {
  font-size: var(--date-size);
  font-weight: 300;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: .6;
  margin-bottom: 20px;
  text-align: center;
}

/* ===================== SAUDAÇÃO ===================== */
.greeting {
  font-size: var(--greeting-size);
  font-weight: 300;
  opacity: .82;
  margin-bottom: 26px;
  text-align: center;
  padding: 0 8px;
}

/* ===================== PESQUISA ===================== */
.search-wrapper {
  position: relative;
  width: 100%;
  max-width: 340px;
}

.search-box {
  width: 100%;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: 14px;
  padding: 0 16px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  transition: .3s;
}

.search-box:focus-within {
  background: rgba(255,255,255,0.11);
  border-color: rgba(255,255,255,0.25);
  box-shadow:
    0 0 0 3px rgba(255,255,255,0.05),
    0 8px 32px rgba(0,0,0,0.3);
}

.search-icon img {
  width: 15px;
  height: 15px;
  opacity: .55;
  flex-shrink: 0;
}

.search-box input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 14px;
  font-family: var(--font-main);
}

.search-box input::placeholder {
  color: rgba(255,255,255,0.4);
}

/* ===================== BOTÕES TOPO ===================== */
.top-bar {
  position: absolute;
  top: 20px;
  right: 16px;
  z-index: 10;
  display: flex;
  gap: 8px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .3s;
  -webkit-tap-highlight-color: transparent;
}

.icon-btn img {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

.icon-btn:hover {
  transform: scale(1.08) translateY(-2px);
  background: var(--glass-bg-hover);
  border-color: var(--glass-border-hover);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

/* ===================== WIDGET CLIMA ===================== */
.weather-widget {
  position: absolute;
  top: 20px;
  left: 16px;
  z-index: 10;
}

.weather-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  border-radius: 16px;
  padding: 14px 18px;
  min-width: 190px;
  cursor: default;
}

.weather-location {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: .55;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.weather-location img {
  width: 12px;
  height: 12px;
  object-fit: contain;
  opacity: .7;
}

.weather-edit-btn {
  margin-left: auto;
  width: 14px;
  height: 14px;
  opacity: .5;
  cursor: pointer;
  transition: opacity .2s;
  flex-shrink: 0;
}

.weather-edit-btn:hover {
  opacity: 1;
}

.weather-main {
  display: flex;
  align-items: center;
  gap: 12px;
}

.weather-temp {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 300;
}

.weather-desc {
  font-size: 12px;
  opacity: .6;
  margin-top: 6px;
}

/* ===================== FAVORITOS ===================== */
.favorites {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  z-index: 5;
  /* Permite scroll horizontal em telas muito pequenas */
  max-width: calc(100vw - 24px);
  overflow-x: auto;
  padding: 4px 8px 8px;
  scrollbar-width: none;          /* Firefox */
  -ms-overflow-style: none;       /* IE/Edge */
}

.favorites::-webkit-scrollbar {
  display: none;                  /* Chrome/Safari */
}

.group {
  position: relative;
  flex-shrink: 0;
}

.group-btn {
  width: 66px;
  height: 66px;
  border-radius: 20px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: .3s var(--spring);
  -webkit-tap-highlight-color: transparent;
}

.group-btn:hover {
  transform: translateY(-5px) scale(1.04);
  background: var(--glass-bg-hover);
  border-color: var(--glass-border-hover);
  box-shadow:
    0 12px 36px rgba(0,0,0,0.4),
    0 0 0 1px rgba(255,255,255,0.08);
}

.group-btn-icon {
  width: 24px;
  height: 24px;
  object-fit: contain;
}

.group-btn-label {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .8px;
  text-transform: uppercase;
  opacity: .55;
}

/* ===================== MODAL ===================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(8px);
}

.modal {
  position: relative;
  z-index: 1;
  background: rgba(14,14,20,0.92);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 28px;
  min-width: 320px;
  max-width: 480px;
  width: 92vw;
  backdrop-filter: blur(30px);
  transform: scale(0.96) translateY(8px);
  transition: transform .25s var(--spring), opacity .25s;
  /* Evita que o modal estoure a tela em celulares */
  max-height: 90vh;
  display: flex;
  flex-direction: column;
}

.modal-overlay.open .modal {
  transform: scale(1) translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-shrink: 0;
}

.modal-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-group-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.modal-group-icon img {
  width: 22px;
  height: 22px;
  object-fit: contain;
}

.modal-name {
  font-size: 16px;
  font-weight: 500;
}

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .2s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.modal-close:hover {
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.9);
}

/* Scroll nos links quando > 7 itens */
.modal-links {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  max-height: var(--modal-links-max-height);
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
}

.modal-links::-webkit-scrollbar {
  width: 4px;
}

.modal-links::-webkit-scrollbar-track {
  background: transparent;
}

.modal-links::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
}

.modal-link {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border-radius: 14px;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.07);
  transition: .25s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.modal-link:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.15);
  transform: translateX(4px);
}

.modal-link-favicon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.modal-link-favicon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.modal-link-info {
  flex: 1;
  min-width: 0;
}

.modal-link-name {
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.modal-link-url {
  font-size: 11px;
  opacity: .4;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===================== MODAL EDITAR CIDADE ===================== */
.city-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  padding: 16px;
}

.city-modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.city-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
}

.city-modal {
  position: relative;
  z-index: 1;
  background: rgba(14,14,20,0.95);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 300px;
  backdrop-filter: blur(30px);
}

.city-modal h3 {
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 16px;
  opacity: .9;
}

.city-input-row {
  display: flex;
  gap: 8px;
}

.city-input {
  flex: 1;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 10px 14px;
  color: white;
  font-family: var(--font-main);
  font-size: 13px;
  outline: none;
  transition: .2s;
  min-width: 0;
}

.city-input:focus {
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.11);
}

.city-input::placeholder {
  color: rgba(255,255,255,0.35);
}

.city-confirm-btn {
  padding: 10px 16px;
  border-radius: 10px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  color: white;
  font-family: var(--font-main);
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
  white-space: nowrap;
}

.city-confirm-btn:hover {
  background: rgba(255,255,255,0.2);
}

.city-error {
  font-size: 11px;
  color: rgba(255,100,100,0.85);
  margin-top: 8px;
  min-height: 16px;
}

/* ===================== BOTÃO SOBRE ===================== */
.about-text-btn {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 18px;
  font-weight: 700;
  color: rgba(255,255,255,0.75);
}

/* ===================== MODAL SOBRE ===================== */
.about-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  padding: 16px;
}

.about-modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.about-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(8px);
}

.about-modal {
  position: relative;
  z-index: 1;
  background: rgba(14,14,20,0.96);
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 22px;
  padding: 30px 32px;
  width: 100%;
  max-width: 320px;
  backdrop-filter: blur(30px);
  transform: scale(0.96) translateY(8px);
  transition: transform .25s var(--spring), opacity .25s;
  text-align: center;
}

.about-modal-overlay.open .about-modal {
  transform: scale(1) translateY(0);
}

.about-modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .2s;
  -webkit-tap-highlight-color: transparent;
}

.about-modal-close:hover {
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.9);
}

.about-app-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  font-size: 26px;
}

.about-app-name {
  font-size: 17px;
  font-weight: 500;
  margin-bottom: 4px;
}

.about-version {
  font-family: var(--font-mono);
  font-size: 12px;
  opacity: .45;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.about-divider {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.08);
  margin: 0 0 18px;
}

.about-dev-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: .4;
  margin-bottom: 10px;
}

.about-dev-name {
  font-size: 15px;
  font-weight: 400;
  opacity: .9;
  margin-bottom: 6px;
}

.about-dev-info {
  font-size: 12px;
  opacity: .5;
  line-height: 1.7;
}

.about-dev-info a {
  color: rgba(255,255,255,0.65);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  transition: .2s;
}

.about-dev-info a:hover {
  color: rgba(255,255,255,0.95);
  border-bottom-color: rgba(255,255,255,0.55);
}

.about-year {
  font-size: 11px;
  opacity: .28;
  margin-top: 18px;
  letter-spacing: .5px;
}

/* ===================== RESPONSIVO — TABLET ===================== */
@media (max-width: 768px) {
  :root {
    --clock-size: 72px;
    --seconds-size: 22px;
    --greeting-size: 15px;
  }

  .container {
    padding-bottom: 100px;
  }

  .favorites {
    gap: 10px;
    bottom: 18px;
  }
}

/* ===================== RESPONSIVO — MOBILE ===================== */
@media (max-width: 480px) {
  :root {
    --clock-size: 54px;
    --seconds-size: 17px;
    --greeting-size: 13px;
    --date-size: 11px;
    /* Em mobile, reduz altura máx dos links proporcionalmente */
    --modal-links-max-height: 350px;
  }

  .clock {
    letter-spacing: -2px;
  }

  .seconds {
    margin-top: 12px;
  }

  .greeting {
    margin-bottom: 18px;
    line-height: 1.4;
  }

  /* Clima: versão compacta no mobile (mantém visível, mas menor) */
  .weather-widget {
    top: 12px;
    left: 12px;
  }

  .weather-card {
    padding: 10px 14px;
    min-width: 0;
    border-radius: 14px;
  }

  .weather-location {
    font-size: 10px;
    letter-spacing: 1px;
  }

  .weather-temp {
    font-size: 22px;
  }

  .weather-desc {
    font-size: 11px;
  }

  /* Top bar ajustada */
  .top-bar {
    top: 12px;
    right: 12px;
    gap: 6px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 11px;
  }

  .icon-btn img {
    width: 16px;
    height: 16px;
  }

  /* Favoritos: botões menores, scroll horizontal já habilitado acima */
  .favorites {
    gap: 8px;
    bottom: 14px;
    padding: 4px 12px 6px;
  }

  .group-btn {
    width: 56px;
    height: 56px;
    border-radius: 17px;
  }

  .group-btn-icon {
    width: 20px;
    height: 20px;
  }

  .group-btn-label {
    font-size: 8px;
  }

  /* Modal ocupa quase tela toda em mobile */
  .modal {
    width: 96vw;
    padding: 20px 18px;
    border-radius: 20px;
    max-height: 85vh;
  }

  .modal-name {
    font-size: 14px;
  }

  .modal-link {
    padding: 10px 14px;
    gap: 12px;
  }

  .modal-link-name {
    font-size: 13px;
  }

  /* Esconde clima em telas muito pequenas (< 380px) */
  @media (max-width: 380px) {
    .weather-widget {
      display: none;
    }
  }
}

/* ===================== RESPONSIVO — TELAS MUITO ALTAS (mobile portrait) ===================== */
@media (max-height: 600px) {
  :root {
    --clock-size: 52px;
    --seconds-size: 16px;
    --greeting-size: 12px;
  }

  .greeting {
    margin-bottom: 12px;
  }

  .container {
    padding-bottom: 80px;
  }

  .favorites {
    bottom: 12px;
  }
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="icon-btn" id="fullscreenBtn" title="Tela cheia">
    <img src="icons/fullscreen.png" alt="Tela cheia">
  </button>
  <button class="icon-btn" id="wallpaperBtn" title="Próximo wallpaper">
    <img src="icons/wallpaper.png" alt="Wallpaper">
  </button>
  <button class="icon-btn about-text-btn" id="aboutBtn" title="Sobre">
    <span>i</span>
  </button>
</div>

<!-- CLIMA -->
<div class="weather-widget">
  <div class="weather-card">
    <div class="weather-location">
      <img src="icons/location.png" alt="Localização">
      <span id="weatherCity">Carregando...</span>
      <img
        src="icons/edit.png"
        alt="Editar cidade"
        class="weather-edit-btn"
        id="editCityBtn"
        title="Editar cidade"
      >
    </div>

function updateClock() {

  const S    = String(now.getSeconds()).padStart(2, '0');

  document.getElementById('clock').textContent    = H + ':' + M;
  document.getElementById('seconds').textContent  = S;
  document.getElementById('date').textContent     = now.toLocaleDateString('pt-BR', {
    weekday: 'long', day: '2-digit', month: 'long'

const WMO_CODES = {
  0:  ['\u2600\uFE0F', 'Céu limpo'],
  1:  ['\uD83C\uDF24\uFE0F', 'Principalmente limpo'],
  2:  ['\u26C5', 'Parcialmente nublado'],

  73: ['\uD83C\uDF28\uFE0F', 'Neve moderada'],
  75: ['\u2744\uFE0F', 'Neve intensa'],
  80: ['\uD83C\uDF26\uFE0F', 'Pancadas leves'],
  81: ['\uD83C\uDF27\uFE0F', 'Pancadas moderadas'],
  82: ['\u26C8\uFE0F', 'Pancadas intensas'],
  95: ['\u26C8\uFE0F', 'Trovoada'],
  96: ['\u26C8\uFE0F', 'Trovoada com granizo'],
  99: ['\u26C8\uFE0F', 'Trovoada com granizo forte'],
};

async function geocodeCity(cityStr) {
  const res  = await fetch(
    'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(cityStr) + '&count=1&language=pt&format=json'
  );
  const data = await res.json();
  if (!data.results || data.results.length === 0) throw new Error('Cidade não encontrada');
  const r = data.results[0];
  return { lat: r.latitude, lon: r.longitude, label: r.name + ', ' + r.country_code };
}

async function fetchWeather(lat, lon) {
  const res  = await fetch(
    'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weathercode&temperature_unit=celsius&timezone=auto'
  );
  const data = await res.json();
  return data.current;
}

function updateWeatherUI(label, temp, code) {
  const info = WMO_CODES[code] || ['\uD83C\uDF21\uFE0F', 'Condição desconhecida'];
  document.getElementById('weatherCity').textContent = label;
  document.getElementById('weatherEmoji').textContent = info[0];
  document.getElementById('weatherTemp').textContent  = Math.round(temp) + '\u00B0C';
  document.getElementById('weatherDesc').textContent  = info[1];
}

async function loadWeather(cityOverride) {
  const savedCity = cityOverride || localStorage.getItem('weatherCity') || 'Sousa, PB';
  try {
    const { lat, lon, label } = await geocodeCity(savedCity);
    const current = await fetchWeather(lat, lon);
    updateWeatherUI(label, current.temperature_2m, current.weathercode);
    localStorage.setItem('weatherCity', savedCity);
    localStorage.setItem('weatherLabel', label);
  } catch (e) {
    const cachedLabel = localStorage.getItem('weatherLabel');
    if (cachedLabel) document.getElementById('weatherCity').textContent = cachedLabel;
    document.getElementById('weatherDesc').textContent = 'Sem conexão';
  }
}

loadWeather();
setInterval(function() { loadWeather(); }, 10 * 60 * 1000);

const cityError    = document.getElementById('cityError');
const cityBackdrop = document.getElementById('cityModalBackdrop');

document.getElementById('editCityBtn').addEventListener('click', function() {
  cityInput.value = localStorage.getItem('weatherCity') || '';
  cityError.textContent = '';
  cityOverlay.classList.add('open');
  setTimeout(function() { cityInput.focus(); }, 100);
});

cityBackdrop.addEventListener('click', function() { cityOverlay.classList.remove('open'); });

document.getElementById('cityConfirmBtn').addEventListener('click', async function() {
  const val = cityInput.value.trim();
  if (!val) return;
  cityError.textContent = '';
  document.getElementById('cityConfirmBtn').textContent = '...';
  try {
    await loadWeather(val);
    cityOverlay.classList.remove('open');
  } catch {
    cityError.textContent = 'Cidade não encontrada. Tente ex: "Recife, BR"';
  } finally {
    document.getElementById('cityConfirmBtn').textContent = 'OK';
  }
});

cityInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter')  document.getElementById('cityConfirmBtn').click();
  if (e.key === 'Escape') cityOverlay.classList.remove('open');
});

/* ===================== MODAL FAVORITOS ===================== */

const overlay    = document.getElementById('modalOverlay');
const modalIcon  = document.getElementById('modalIcon');
const modalName  = document.getElementById('modalName');
const modalLinks = document.getElementById('modalLinks');

function openModal(groupIndex) {
  const g = groups[groupIndex];
  if (!g) return;

  modalIcon.innerHTML = '<img src="' + g.icon + '" alt="' + g.name + '" width="22" height="22" style="object-fit:contain">';
  modalName.textContent = g.name;
  modalLinks.innerHTML  = '';

  g.links.forEach(function(link) {
    var domain = link.url;
    try { domain = new URL(link.url).hostname; } catch (e) {}

    const a = document.createElement('a');
    a.className = 'modal-link';
    a.href      = link.url;
    a.target    = '_blank';
    a.rel       = 'noopener noreferrer';
    a.innerHTML =
      '<div class="modal-link-favicon">' +
        '<img src="' + link.icon + '" alt="' + link.name + '" loading="lazy">' +
      '</div>' +
      '<div class="modal-link-info">' +
        '<div class="modal-link-name">' + link.name + '</div>' +
        '<div class="modal-link-url">'  + domain    + '</div>' +
      '</div>';

    modalLinks.appendChild(a);
  });

  // Rola de volta ao topo sempre que abrir
  modalLinks.scrollTop = 0;

  overlay.classList.add('open');
}

function closeModal() {
  overlay.classList.remove('open');
}

document.querySelectorAll('.group-btn').forEach(function(btn) {
  btn.addEventListener('click', function() { openModal(+btn.dataset.group); });
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.querySelector('.modal-backdrop').addEventListener('click', closeModal);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal();
    cityOverlay.classList.remove('open');
  }
});

/* ===================== FULLSCREEN ===================== */

const fullscreenBtn = document.getElementById('fullscreenBtn');

function updateFullscreenIcon() {
  const isFs = !!document.fullscreenElement;
  fullscreenBtn.innerHTML = isFs
    ? '<img src="icons/undo.png" alt="Sair de tela cheia">'
    : '<img src="icons/fullscreen.png" alt="Tela cheia">';
  fullscreenBtn.title = isFs ? 'Sair de tela cheia' : 'Tela cheia';
}

fullscreenBtn.addEventListener('click', function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function() {});
  } else {
    document.exitFullscreen().catch(function() {});
  }
});

document.addEventListener('fullscreenchange', updateFullscreenIcon);
